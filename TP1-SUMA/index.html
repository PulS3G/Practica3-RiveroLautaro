<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafío de Suma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Suma Flash</h1>
        <div id="display" class="number-box">?</div>
        
        <button id="start-btn">Iniciar Secuencia</button>

        <div id="answer-section" class="hidden">
            <input type="number" id="user-sum" placeholder="Total de la suma...">
            <button id="check-btn">Verificar</button>
        </div>

        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
